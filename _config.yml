title: "honey"
description: дневник радости и родительская школа хани кидс
author: "Кирилл Назаров"
remote_theme: pages-themes/hacker@v0.2.0
plugins:
- jekyll-remote-theme # add this line to the plugins list if you already have one
- jekyll-readme-index
- jekyll-github-metadata
- jekyll-relative-links

# Для GitHub Pages (проектный сайт)
baseurl: ""
url: "https://nazarovki.github.io"

# Настройки по умолчанию
defaults:
  - scope:
      path: "/honey"
    values:
      layout: "default"
  - scope:
      type: "posts"
    values:
      # Это ключ! Посты будут по адресу /2026/07/05/go/
      permalink: "/:year/:month/:day/:title/"

collections:
  notes:
    output: false
    permalink: /notes/:path/
  articles:      # папка _articles — для статей
    output: true # опубликовать
  private:       # папка _private — для личного
    output: false
  books:        # папка для заметок о книгах
    output: true	
